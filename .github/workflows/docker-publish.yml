name: Publish Docker image

# Builds the backend's production image and pushes it to GHCR so the
# frontend's docker-compose.fullstack.yml (and anyone else) can run the
# full stack without building the backend from source themselves.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/arrowconmango_backend:latest
            ghcr.io/${{ github.repository_owner }}/arrowconmango_backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
