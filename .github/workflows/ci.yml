name: CI

# Integración Continua del backend Arrow con Mango.
# Se ejecuta en cada push a master y en cada Pull Request hacia master,
# además de poder lanzarse manualmente desde la pestaña Actions.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo branch/PR cuando llega un nuevo push,
# para no malgastar minutos de runner en commits ya superados.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    # Valores de prueba: los tests de integración/e2e usan SQLite :memory:,
    # así que NO se necesita ningún secreto real ni base de datos externa.
    env:
      NODE_ENV: test
      DB_DRIVER: sqlite
      DB_PATH: ':memory:'
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # --legacy-peer-deps replica el requisito documentado en el README
      # (conflicto de peer dependencies de NestJS 10). npm ci usa el lockfile.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (nest build)
        run: npm run build

      - name: Test (86 tests + coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
