# Render Blueprint (Infrastructure as Code) — https://render.com/docs/blueprint-spec
# Deploy via Render's "New Blueprint" flow pointing at this repo, or let
# Render auto-detect this file when connecting the repo as a Web Service.
#
# Vars marked `sync: false` are NOT committed here — set them once in the
# Render dashboard (Environment tab) after the first deploy:
#   DATABASE_URL    — Neon/Render Postgres connection string (?sslmode=require)
#   CORS_ORIGINS    — e.g. https://<your-github-username>.github.io
#   ADMIN_USER_IDS  — your own registered user id, once you know it
#
# JWT_SECRET is auto-generated by Render on first deploy (generateValue).

services:
  - type: web
    name: arrow-con-mango-api
    runtime: docker
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        sync: false
      - key: DB_SYNCHRONIZE
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      # Idempotent (skips ids that already exist) — safe to leave on
      # permanently, but only strictly needed for the first deploy.
      - key: SEED_ON_BOOT
        value: 'true'
